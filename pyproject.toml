[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# "crosscheck" is taken on PyPI; the installed command is still `crosscheck`.
name = "crosscheck-cli"
version = "0.2.1"
description = "One model shouldn't grade its own homework. An independent AI model (or a jury of them) reviews your diff before you accept it."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aleksei" }]
requires-python = ">=3.8"
dependencies = []
keywords = ["code-review", "ai", "llm", "codex", "gemini", "claude-code", "pre-commit", "git"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/karhuzin-lgtm/crosscheck"

[project.scripts]
crosscheck = "crosscheck.cli:main"

[tool.setuptools]
packages = ["crosscheck"]
